services:
  postgres:
    image: postgres:16-alpine
    container_name: kasir-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: kasir
      POSTGRES_PASSWORD: kasir_password
      POSTGRES_DB: kasir_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kasir -d kasir_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./server-go
      dockerfile: Dockerfile
    container_name: kasir-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PORT: "8080"
      DATABASE_URL: postgres://kasir:kasir_password@postgres:5432/kasir_db?sslmode=disable
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:8080/health?format=plain || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: kasir-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "3000:80"

volumes:
  pgdata:
